# security scanning via CodeQL, advanced setup with manual build mode
#
# autobuild is not used here, WinUI3 needs the same explicit build pass release.yml documents
# (MarkupCompilePass2 needs a full Build pass to resolve x:Bind LocalAssembly types)
name: codeql

# codeql is not a required status check, so path filtering is safe here; skipping it on a doc-only change
# leaves nothing pending, unlike the build and format checks in pr-build.yml
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    - cron: "24 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: initialize codeql
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # always the project, never Calculator.slnx; the solution also contains the frozen
      # WPF v1 (net472, packages.config) which does not build on a dotnet-only runner
      - name: restore
        run: dotnet restore Calculator_WinUI/Calculator_WinUI.csproj -p:Platform=x64 -r win-x64 -p:SelfContained=true

      - name: build win-x64
        run: dotnet build Calculator_WinUI/Calculator_WinUI.csproj --no-restore -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true

      - name: perform codeql analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
