# CodeQL, advanced setup with a manual build (autobuild misses the full pass x:Bind needs)
name: codeql

# not a required check, so path filtering is safe here
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    - cron: "24 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: initialize codeql
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # always the project, never FluentMath.slnx; the solution also holds WPF v1, which needs net472
      - name: restore
        run: dotnet restore FluentMath/FluentMath.csproj -p:Platform=x64 -r win-x64 -p:SelfContained=true

      - name: build win-x64
        run: dotnet build FluentMath/FluentMath.csproj --no-restore -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true

      - name: perform codeql analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
