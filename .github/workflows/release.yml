# builds the win-x64 installer and drafts a release for every version tag, versioned from the csproj;
# the msixupload for the store comes last, as an artifact
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # reads the version once so the csproj stays the only place it gets bumped by hand
      - name: read version from csproj
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content FluentMath/FluentMath.csproj)
          $version = $xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      # always the project, never FluentMath.slnx; the solution also holds WPF v1, which needs net472
      - name: restore
        run: dotnet restore FluentMath/FluentMath.csproj -p:Platform=x64 -r win-x64 -p:SelfContained=true

      # a full build first, so MarkupCompilePass2 finds the LocalAssembly for x:Bind (else WMC1509/WMC9999)
      - name: build win-x64
        run: dotnet build FluentMath/FluentMath.csproj --no-restore -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true

      # through win-x64.pubxml, so CI publishes exactly like a local publish, PublishTrimmed=false included
      - name: publish win-x64
        run: dotnet publish FluentMath/FluentMath.csproj --no-build -c Release -p:Platform=x64 -p:PublishProfile=win-x64

      - name: install inno setup
        run: choco install innosetup -y --no-progress

      - name: compile installer
        shell: pwsh
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.version.outputs.version }}
          Setup\FluentMath_Setup.iss

      - name: upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: FluentMath_Installer
          path: Setup/Output/FluentMath_Installer.exe

      # create draft only
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          Setup/Output/FluentMath_Installer.exe
          --draft --generate-notes --title "Fluent Math ${{ github.ref_name }}"

      # last, after the draft exists, since it rebuilds into the same bin and obj and a red step must not
      # cost the installer; StoreUpload makes an unsigned .msixupload, the store signs it
      # (the version comes from StampAppxManifestVersion in the csproj); no symbol package, since its
      # mspdbcmf.exe ships with visual studio only and the dotnet cli fails the whole upload without it
      - name: package msix for the store
        run: >
          dotnet publish FluentMath/FluentMath.csproj -c Release -p:Platform=x64
          -p:PublishProfile=win-x64
          -p:WindowsPackageType=MSIX
          -p:GenerateAppxPackageOnBuild=true
          -p:UapAppxPackageBuildMode=StoreUpload
          -p:AppxPackageSigningEnabled=false
          -p:AppxSymbolPackageEnabled=false
          "-p:AppxPackageDir=${{ github.workspace }}\Setup\Output\Msix\\"

      # an artifact, not a release asset; it is uploaded to partner center by hand
      - name: upload msix artifact
        uses: actions/upload-artifact@v7
        with:
          name: FluentMath_Store
          path: Setup/Output/Msix/*.msixupload
          if-no-files-found: error
