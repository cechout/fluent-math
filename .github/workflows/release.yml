# builds the win-x64 installer and drafts a GitHub release whenever a version tag is pushed
# csproj Version is the single source of truth, Inno Setup receives it as a command line define
# the msixupload for the microsoft store is packaged last and left as an artifact, see the comment above it
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # reads the version once so the csproj stays the only place it gets bumped by hand
      - name: read version from csproj
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content FluentMath/FluentMath.csproj)
          $version = $xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      # always the project, never FluentMath.slnx; the solution also contains the frozen
      # WPF v1 (net472, packages.config) which does not build on a dotnet-only runner
      - name: restore
        run: dotnet restore FluentMath/FluentMath.csproj -p:Platform=x64 -r win-x64 -p:SelfContained=true

      # WinUI3 x:Bind on types defined in this project needs a full Build pass first, so
      # MarkupCompilePass2 gets the LocalAssembly it resolves them against, otherwise the XAML
      # compiler fails on a from-scratch checkout with no prior obj state (WMC1509/WMC9999)
      - name: build win-x64
        run: dotnet build FluentMath/FluentMath.csproj --no-restore -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true

      # uses the real win-x64.pubxml (Properties/PublishProfiles) so CI applies the exact same
      # settings as a local Visual Studio publish, PublishTrimmed=false included
      - name: publish win-x64
        run: dotnet publish FluentMath/FluentMath.csproj --no-build -c Release -p:Platform=x64 -p:PublishProfile=win-x64

      - name: install inno setup
        run: choco install innosetup -y --no-progress

      - name: compile installer
        shell: pwsh
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.version.outputs.version }}
          Setup\FluentMath_Setup.iss

      - name: upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: FluentMath_Installer
          path: Setup/Output/FluentMath_Installer.exe

      # create draft only
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          Setup/Output/FluentMath_Installer.exe
          --draft --generate-notes --title "Fluent Math ${{ github.ref_name }}"

      # built last, after the draft release already exists: it rebuilds the same project packaged, into the same
      # bin and obj folders the installer was compiled from, and a red step here must not cost the installer and
      # the release that are already done
      # the unpackaged build above is the full build pass the xaml compiler needs, so this publish may build
      # StoreUpload produces a .msixupload holding an unsigned msix, which is what partner center takes; the store
      # signs it itself
      # no version is passed: the StampAppxManifestVersion target in the csproj writes it into the manifest
      - name: package msix for the store
        run: >
          dotnet publish FluentMath/FluentMath.csproj -c Release -p:Platform=x64
          -p:PublishProfile=win-x64
          -p:WindowsPackageType=MSIX
          -p:GenerateAppxPackageOnBuild=true
          -p:UapAppxPackageBuildMode=StoreUpload
          -p:AppxPackageSigningEnabled=false
          "-p:AppxPackageDir=${{ github.workspace }}\Setup\Output\Msix\\"

      # deliberately not a release asset: a .msixupload belongs in partner center and nobody can install it from a
      # release page, so it stays an artifact to download and upload by hand
      - name: upload msix artifact
        uses: actions/upload-artifact@v7
        with:
          name: FluentMath_Store
          path: Setup/Output/Msix/*.msixupload
          if-no-files-found: error
