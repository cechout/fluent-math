# validates that a pull request actually compiles before review
# deliberately lighter than release.yml: build only, no publish/installer step, not tied to a version tag
name: pr build check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: Calculator_WinUI/Calculator_WinUI.csproj

      # always the project, never Calculator.slnx; the solution also contains the frozen
      # WPF v1 (net472, packages.config) which does not build on a dotnet-only runner
      - name: restore
        run: dotnet restore Calculator_WinUI/Calculator_WinUI.csproj -p:Platform=x64 -r win-x64 -p:SelfContained=true

      # same build command release.yml relies on, a single full build pass is enough here
      # since there is no publish step after it
      - name: build win-x64
        run: dotnet build Calculator_WinUI/Calculator_WinUI.csproj --no-restore -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true

  test:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: Calculator_WinUI.Tests/Calculator_WinUI.Tests.csproj

      # the test project links the engine sources rather than referencing the app, so it is plain
      # net8.0 and needs neither a platform nor a runtime identifier here
      - name: engine tests
        run: dotnet test Calculator_WinUI.Tests/Calculator_WinUI.Tests.csproj -c Release

  format:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # no cache here, unlike the build job, dotnet format whitespace does not
      # reliably populate the nuget packages folder the cache action expects to save
      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # scoped to whitespace only, matches the .editorconfig, not style/analyzers
      #
      # no -p:Platform here, dotnet format has no MSBuild property option and answers one with its
      # usage help and a non zero exit, so the check would never actually run
      #
      # end_of_line = lf only holds because .gitattributes pins the checkout to lf; without it the
      # runner default core.autocrlf=true hands out a crlf tree and every line fails
      - name: dotnet format whitespace check
        run: dotnet format whitespace Calculator_WinUI/Calculator_WinUI.csproj --verify-no-changes --verbosity diagnostic

      # the test sources are held to the same editorconfig; the engine files it links are already
      # covered by the run above, checking them twice costs nothing
      - name: dotnet format whitespace check, tests
        run: dotnet format whitespace Calculator_WinUI.Tests/Calculator_WinUI.Tests.csproj --verify-no-changes --verbosity diagnostic
