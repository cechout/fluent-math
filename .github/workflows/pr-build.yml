# builds every pull request and reports the publish payload size; (no installer, no version tag)
name: pr build check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # build and format are required checks, so they report on every pull request, doc-only ones too; the gate
  # sits on the jobs, since a workflow skipped by paths-ignore never reports and blocks the merge
  # https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/defining-the-mergeability-of-pull-requests/troubleshooting-required-status-checks
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # the changed files from the api, so there is no clone and no fetch depth to guess
      # (every uncertain path sets code=true, since a skipped job reports success)
      - name: check whether anything buildable changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename'); then
            echo "could not list the changed files, building anyway"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$changed"

          if [ -z "$changed" ]; then
            echo "no files reported, building anyway"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$changed" | grep -qvE '(\.md$|^\.github/ISSUE_TEMPLATE/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # only an explicit code=false skips the build, so a broken filter costs a build rather than a pass
  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: FluentMath/FluentMath.csproj

      # always the project, never FluentMath.slnx; the solution also holds WPF v1, which needs net472
      - name: restore
        run: dotnet restore FluentMath/FluentMath.csproj -p:Platform=x64 -r win-x64 -p:SelfContained=true

      # the build release.yml relies on; one full pass feeds the publish and the size report
      - name: build win-x64
        run: dotnet build FluentMath/FluentMath.csproj --no-restore -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true

      # the publish is what the size means, and it proves the publish path before a release depends on it
      # (--no-build reuses the pass above)
      - name: publish win-x64
        run: dotnet publish FluentMath/FluentMath.csproj --no-build -c Release -p:Platform=x64 -p:PublishProfile=win-x64

      # absolute numbers only; the ten largest files show where a jump comes from
      - name: report publish size
        shell: pwsh
        run: |
          $publishDir = "FluentMath/bin/x64/Release/net8.0-windows10.0.19041.0/publish/win-x64"
          $root = (Resolve-Path $publishDir).Path
          $files = Get-ChildItem $root -Recurse -File
          $total = ($files | Measure-Object -Property Length -Sum).Sum

          $lines = @()
          $lines += "## Publish payload"
          $lines += ""
          $lines += "Total: **$([math]::Round($total / 1MB, 2)) MB** across $($files.Count) files"
          $lines += ""
          $lines += "| Largest files | Size |"
          $lines += "| :--- | ---: |"
          foreach ($file in $files | Sort-Object Length -Descending | Select-Object -First 10)
          {
            $name = $file.FullName.Substring($root.Length + 1)
            $lines += "| $name | $([math]::Round($file.Length / 1MB, 2)) MB |"
          }

          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "Publish payload: $([math]::Round($total / 1MB, 2)) MB"

  # gated like the two above, though not a required check yet
  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: FluentMath.Tests/FluentMath.Tests.csproj

      # plain net8.0, so neither a platform nor a runtime identifier
      - name: engine tests
        run: dotnet test FluentMath.Tests/FluentMath.Tests.csproj -c Release

  format:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # no cache; dotnet format does not reliably fill the nuget folder the cache action saves
      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # whitespace only, against the .editorconfig
      # (no -p:Platform, which dotnet format answers with its usage help; lf holds through .gitattributes)
      - name: dotnet format whitespace check
        run: dotnet format whitespace FluentMath/FluentMath.csproj --verify-no-changes --verbosity diagnostic

      # the test sources against the same editorconfig
      - name: dotnet format whitespace check, tests
        run: dotnet format whitespace FluentMath.Tests/FluentMath.Tests.csproj --verify-no-changes --verbosity diagnostic
